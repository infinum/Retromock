name: Primary

on:
  push:
    branches: [master]   # other branches are built through their PRs
    tags: ['**']
  pull_request:
  workflow_dispatch:      # manual runs

# Build and test code from the PR must not get a token that can do more than read.
permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Primary   # the required status check's name, so it must be unique in the repo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble
        run: ./gradlew assemble --stacktrace

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain --stacktrace

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Build the JAR
        run: ./gradlew jar --stacktrace

      - name: Build the sources JAR
        run: ./gradlew sourcesJar --stacktrace

      - name: Generate the API docs
        run: ./gradlew dokkaGenerate --stacktrace

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.job }}   # unique per job: a second upload with the same name fails
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
